<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <title>Replace with the figure's subject</title>
  <desc>Replace with a concise description of the relationships shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Source Sans 3'; fill: #0f172a; font-size: 16px; }
      .heading { font-size: 20px; font-weight: 600; }
      .primary { font-weight: 600; }
      .secondary { font-size: 14px; fill: #475569; }
      .region { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .object { fill: #fff; stroke: #64748b; stroke-width: 1.4; }
      .route { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="720" height="420" fill="#fff"/>
  <!-- Define meaningful regions, routes, bodies, and labels after choosing the composition. -->
  <g id="regions"/>
  <g id="routes"/>
  <g id="objects"/>
  <g id="labels"/>
</svg>
